name: myworld_plus
description: "MyWorld+ — Your life. One place."
publish_to: 'none'
version: 0.1.2+3

environment:
  sdk: ^3.13.5

dependencies:
  app_links: ^7.2.2
  barcode_widget: ^2.0.4
  cloud_firestore: ^7.0.0
  cloud_functions: ^7.0.0
  crypto: ^3.0.7
  cunning_document_scanner: ^3.0.3
  file_picker: ^13.1.0
  firebase_analytics: ^13.0.0
  firebase_app_check: ^0.5.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  firebase_crashlytics: ^6.0.0
  firebase_messaging: ^17.0.0
  firebase_storage: ^14.0.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  go_router: ^18.1.0
  google_mobile_ads: ^9.1.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  local_auth: ^3.0.2
  mime: ^2.1.0
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  pdf: ^3.13.1
  pdfrx: ^2.6.5
  purchases_flutter: ^10.16.0
  share_plus: ^13.3.1
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
